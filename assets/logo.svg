<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="ksBg" cx="50%" cy="42%" r="64%">
      <stop offset="0%" stop-color="#2b0d16"/>
      <stop offset="60%" stop-color="#12070c"/>
      <stop offset="100%" stop-color="#060308"/>
    </radialGradient>
    <linearGradient id="ksBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="48%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="ksGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ksCrimson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <radialGradient id="ksEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Matched Trinity Rounded Obsidian Tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#ksBg)" stroke="url(#ksBorder)" stroke-width="4"/>

  <!-- Gothic Cathedral Rose-Window AEAD Cipher Ring -->
  <circle cx="128" cy="132" r="88" fill="none" stroke="#be123c" stroke-width="2" opacity="0.48"/>
  <circle cx="128" cy="132" r="78" fill="none" stroke="url(#ksGold)" stroke-width="2.2" stroke-dasharray="8 6" opacity="0.72"/>
  <g stroke="#e11d48" stroke-width="1.6" opacity="0.38">
    <line x1="128" y1="44" x2="128" y2="220"/>
    <line x1="40" y1="132" x2="216" y2="132"/>
    <line x1="66" y1="70" x2="190" y2="194"/>
    <line x1="190" y1="70" x2="66" y2="194"/>
  </g>
  <!-- Rose Petals / Octagonal Seal -->
  <polygon points="128,50 186,74 210,132 186,190 128,214 70,190 46,132 70,74"
           fill="none" stroke="url(#ksCrimson)" stroke-width="2" opacity="0.55"/>

  <!-- Imperial Crown of the King of Apparitions -->
  <path d="M84,92 L96,60 L114,80 L128,48 L142,80 L160,60 L172,92 Z"
        fill="url(#ksGold)" stroke="#fef08a" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="128" cy="44" r="4.2" fill="#fef08a"/>
  <circle cx="95" cy="56" r="3.2" fill="#fb7185"/>
  <circle cx="161" cy="56" r="3.2" fill="#fb7185"/>

  <!-- Zero-Trust AEAD Aegis Shield -->
  <path d="M78,100 L178,100 L172,152 C168,180 148,200 128,212 C108,200 88,180 84,152 Z"
        fill="#16070e" stroke="url(#ksGold)" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M88,108 L168,108 L163,150 C160,173 144,190 128,200 C112,190 96,173 93,150 Z"
        fill="url(#ksCrimson)" opacity="0.32"/>

  <!-- Golden Slit-Pupil / Cipher Keyhole Core -->
  <circle cx="128" cy="148" r="32" fill="url(#ksEyeGlow)"/>
  <path d="M98,148 Q128,122 158,148 Q128,174 98,148 Z"
        fill="#0b0408" stroke="url(#ksGold)" stroke-width="2.8"/>
  <ellipse cx="128" cy="148" rx="13" ry="13" fill="url(#ksGold)"/>
  <!-- Vertical Vampire Slit / Keyhole -->
  <polygon points="128,134 132,148 128,164 124,148" fill="#14040a"/>
  <circle cx="133" cy="142" r="2.6" fill="#fef9c3"/>
</svg>
