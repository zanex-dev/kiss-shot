[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kiss-shot"
version = "0.2.0"
description = "Zero-Trust End-to-End Encrypted (AES-256-GCM) OpenAI Inference Bridge & Ephemeral Ciphertext Mailbox for Remote GPUs. Codename: Kiss-Shot (姬丝秀忒)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "zanex", email = "310354113+zanex-dev@users.noreply.github.com" }
]
keywords = [
    "kiss-shot",
    "zero-trust",
    "e2ee",
    "aes-256-gcm",
    "llm-security",
    "openai-proxy",
    "gpu-cloud",
    "privacy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cryptography>=42.0.0",
    "pyzipper>=0.3.6",
    "huggingface_hub>=0.24.0",
]

[project.scripts]
kiss-shot = "kiss_shot.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kiss_shot*"]
